unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Reduce escape delay (important for Neovim)
set -sg escape-time 10

# Automatically renumber windows
set -g renumber-windows on

setw -g mode-keys vi

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

bind v split-window -v
bind h split-window -h

bind j select-pane -L
bind k select-pane -D
bind l select-pane -U
bind ö select-pane -R

bind u previous-window
bind i next-window

##### Status bar #####

set -g status-position bottom
set -g status-interval 5

# Gruvbox dark colors
set -g status-style "bg=#282828,fg=#a89984"

set -g window-status-format " #I:#W "
set -g window-status-current-format " #[fg=#282828,bg=#fabd2f,bold] #I:#W #[default]"

set -g status-left "#[fg=#282828,bg=#b8bb26,bold] #S #[default] "
set -g status-right "#[fg=#928374] %Y-%m-%d %H:%M "

# Pane borders
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"

# Message/command colors
set -g message-style "bg=#3c3836,fg=#ebdbb2"
